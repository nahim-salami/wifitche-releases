name: Build Windows (WiFiTche)

# Build dans le depot PUBLIC wifitche-releases (runner windows-latest gratuit
# pour les depots publics). Le code source prive `wifitche` est clone de facon
# ephemere dans src/ ; seuls les ZIP des executables sont publies en Release.
#
# Prerequis (une fois) : secret `WIFITCHE_SOURCE_TOKEN` = PAT fine-grained
# « Contents: Read » sur le depot prive nahim-salami/wifitche.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branche/tag du depot prive a builder"
        required: true
        default: "main"
        type: string
      api_base_url:
        description: "URL du backend (API_BASE_URL)"
        required: true
        default: "https://wifitche-api.vercel.app/api/v1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `iss` = script Inno Setup du depot prive. Absent = pas d'installateur
          # pour cette app (seule l'archive portable est publiee).
          - name: admin
            path: admin
            asset: wifitche-admin-windows.zip
            project: wifitche_admin
            iss: wifitche-admin.iss
            setup: wifitche-admin-setup.exe
            setup_zip: wifitche-admin-setup.zip
          - name: client
            path: client
            asset: wifitche-client-windows.zip
            project: wifitche_client
            iss: wifitche-client.iss
            setup: wifitche-client-setup.exe
            setup_zip: wifitche-client-setup.zip
          - name: techno
            path: tech
            asset: wifitche-techno-windows.zip
            project: wifitche_techno
            iss: wifitche-techno.iss
            setup: wifitche-techno-setup.exe
            setup_zip: wifitche-techno-setup.zip

    steps:
      - name: Cloner le code source prive (ephemere)
        uses: actions/checkout@v4
        with:
          repository: nahim-salami/wifitche
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.WIFITCHE_SOURCE_TOKEN }}
          path: src

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate windows project if missing
        shell: bash
        working-directory: src/${{ matrix.path }}
        run: |
          if [ ! -d "windows" ]; then
            flutter create --org net.ahime.wifitche --project-name ${{ matrix.project }} --platforms=windows .
          fi

      - name: Get dependencies
        working-directory: src/${{ matrix.path }}
        run: flutter pub get

      - name: Build Windows release
        working-directory: src/${{ matrix.path }}
        env:
          # firebase_cpp_sdk (admin: notifications push) declare cmake_minimum_required < 3.5,
          # supprime dans CMake recent. Force la policy minimale pour configurer quand meme.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Package ZIP
        id: pack
        shell: pwsh
        working-directory: src/${{ matrix.path }}
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (-not (Test-Path $rel)) { $rel = "build/windows/runner/Release" }
          if (-not (Test-Path $rel)) { Write-Error "Release folder not found"; exit 1 }
          $zip = "$env:GITHUB_WORKSPACE/${{ matrix.asset }}"
          Compress-Archive -Path "$rel/*" -DestinationPath $zip -Force
          "zip_path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $zip | Select-Object Name, Length

      - name: Install Inno Setup
        if: matrix.iss != ''
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        id: installer
        if: matrix.iss != ''
        shell: pwsh
        working-directory: src/${{ matrix.path }}
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe introuvable"; exit 1 }

          # Version depuis pubspec.yaml ("1.0.0+1" -> "1.0.0") : elle s'affiche
          # dans Applications installees et pilote le remplacement a la mise a jour.
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim().Split('+')[0]

          $rel = Resolve-Path "build/windows/x64/runner/Release" -ErrorAction SilentlyContinue
          if (-not $rel) { $rel = Resolve-Path "build/windows/runner/Release" }

          & $iscc "/DSourceDir=$rel" "/DAppVersion=$version" "/DOutputDir=$(Resolve-Path .)\build\installer" "windows/installer/${{ matrix.iss }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Compilation de l'installateur echouee"; exit 1 }

          # L'installateur part zippe : un .exe telecharge directement est bloque
          # par les navigateurs et par SmartScreen bien plus souvent qu'une archive.
          $zip = "$env:GITHUB_WORKSPACE/${{ matrix.setup_zip }}"
          Compress-Archive -Path "build/installer/${{ matrix.setup }}" -DestinationPath $zip -Force
          "setup_zip_path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $zip | Select-Object Name, Length

      - name: Publish installer (ZIP)
        if: matrix.iss != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WiFiTche - derniere version
          files: ${{ steps.installer.outputs.setup_zip_path }}
          fail_on_unmatched_files: true

      - name: Publish stable release assets (depot public courant)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WiFiTche - derniere version
          files: ${{ steps.pack.outputs.zip_path }}
          fail_on_unmatched_files: true

      - name: Summary
        shell: bash
        run: |
          echo "### Windows ${{ matrix.name }} OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive portable: ${{ matrix.asset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installateur: ${{ matrix.setup_zip || 'aucun' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: nahim-salami/wifitche@${{ inputs.source_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ inputs.api_base_url }}" >> "$GITHUB_STEP_SUMMARY"

name: Build Web Client (PWA)

# Build dans le depot PUBLIC wifitche-releases (minutes Actions gratuites).
# Le code source prive `wifitche` est clone de facon ephemere, puis le PWA
# client est compile et deploye sur Vercel (wifitche-app).
#
# Prerequis : secret `WIFITCHE_SOURCE_TOKEN` (PAT Contents:Read sur wifitche)
# + secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID (projet client).

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branche/tag du depot prive a builder"
        required: true
        default: "main"
        type: string
      api_base_url:
        description: "URL du backend (API_BASE_URL)"
        required: true
        default: "https://wifitche-api.vercel.app/api/v1"
        type: string

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}

jobs:
  build-web:
    name: Build client web (PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cloner le code source prive (ephemere)
        uses: actions/checkout@v4
        with:
          repository: nahim-salami/wifitche
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.WIFITCHE_SOURCE_TOKEN }}
          path: src

      - name: Installer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generer le dossier web/ si manquant
        working-directory: src/client
        run: |
          if [ ! -d "web" ]; then
            flutter create --org net.ahime.wifitche --project-name wifitche_client --platforms=web .
          fi

      - name: Recuperer les dependances
        working-directory: src/client
        run: flutter pub get

      - name: Build Web (release, PWA)
        working-directory: src/client
        run: flutter build web --release --pwa-strategy=offline-first --base-href / --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Personnaliser le PWA (manifest + titre)
        working-directory: src/client
        run: |
          python3 - <<'PY'
          import json, os
          p = "build/web/manifest.json"
          if os.path.exists(p):
              m = json.load(open(p, encoding="utf-8"))
              m["name"] = "WiFiTche"
              m["short_name"] = "WiFiTche"
              m["description"] = "Connexion Wi-Fi rapide & securisee"
              m["theme_color"] = "#F28C28"
              m["background_color"] = "#FFFBF7"
              m["display"] = "standalone"
              json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          sed -i 's#<title>[^<]*</title>#<title>WiFiTche</title>#' build/web/index.html || true

      - name: Deployer le PWA sur Vercel (wifitche-app)
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: src/client
        run: |
          npm i -g vercel@latest
          URL=$(vercel deploy build/web --prod --yes --token "$VERCEL_TOKEN")
          echo "### PWA deploye" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL : $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: nahim-salami/wifitche@${{ inputs.source_ref }}" >> "$GITHUB_STEP_SUMMARY"
